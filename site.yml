# Généré par npm run configure depuis config/site.json. Ne pas modifier directement.
site:
  title: "Master CSMI · Stages YYYY"
  url: "https://master-csmi.github.io/csmi-stages"
  start_page: "csmi-stages:ROOT:index.adoc"
content:
  sources:
  - url: ./
    branches: HEAD
ui:
  bundle:
    url: "https://github.com/feelpp/antora-ui/releases/download/v0.45-rc.2/ui-bundle.zip"
    snapshot: true
output:
  clean: true
  dir: public
asciidoc:
  attributes:
    year: "YYYY"
    repo: "csmi-stages"
    stages-uri: "https://github.com/master-csmi/csmi-stages"
    pr-uri: "https://github.com/master-csmi/csmi-stages/compare"
    max-pdf-size-mib: "20"
    hide-uri-scheme: ""
